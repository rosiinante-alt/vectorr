services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # =========================================================================
  # Vectroy Node.js Backend
  # =========================================================================
  vectroy:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    container_name: vectroy-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Supabase Configuration (required)
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      # Site URL for redirects (set to your domain)
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}

      # Replicate — powers vectorize / upscale / remove-bg / style-transfer
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}

      # Redis — BullMQ queues used by the worker processes
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      # Polar payments
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET}
      POLAR_SERVER: ${POLAR_SERVER:-production}
      POLAR_PRODUCT_ONE_TIME_CREDITS: ${POLAR_PRODUCT_ONE_TIME_CREDITS}
      POLAR_PRODUCT_STARTER_MONTHLY: ${POLAR_PRODUCT_STARTER_MONTHLY}
      POLAR_PRODUCT_PLUS_MONTHLY: ${POLAR_PRODUCT_PLUS_MONTHLY}
      POLAR_PRODUCT_PRO_MONTHLY: ${POLAR_PRODUCT_PRO_MONTHLY}
      POLAR_PRODUCT_STARTER_ANNUAL: ${POLAR_PRODUCT_STARTER_ANNUAL}
      POLAR_PRODUCT_PLUS_ANNUAL: ${POLAR_PRODUCT_PLUS_ANNUAL}
      POLAR_PRODUCT_PRO_ANNUAL: ${POLAR_PRODUCT_PRO_ANNUAL}

      # Next.js production settings
      NODE_ENV: production

    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - vectroy-network

    # Optional: Coolify volumes for persistent data
    volumes:
      - vectroy-logs:/app/logs

  # =========================================================================
  # Vectroy BullMQ workers
  # ---------------------------------------------------------------------------
  # The web container only serves HTTP. Queued conversions are consumed here,
  # so without this service every job would sit in Redis forever.
  # =========================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: vectroy-worker
    restart: unless-stopped
    environment:
      # Supabase Configuration (required)
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      # Replicate — powers vectorize / upscale / remove-bg / style-transfer
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}

      # Redis — must point at the `redis` service, not localhost
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      NODE_ENV: production

    depends_on:
      - redis

    networks:
      - vectroy-network

  # =========================================================================
  # Optional: Nginx reverse proxy (for Coolify)
  # Uncomment to add reverse proxy in front of Vectroy
  # =========================================================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: vectroy-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - vectroy
  #   networks:
  #     - vectroy-network

networks:
  vectroy-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  vectroy-logs:
    driver: local
