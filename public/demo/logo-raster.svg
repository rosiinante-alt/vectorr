<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="rasterize">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" />
    </filter>
  </defs>
  <rect width="200" height="200" fill="#f0f0f0"/>
  <circle cx="100" cy="80" r="35" fill="#FF6B6B" filter="url(#rasterize)" opacity="0.85"/>
  <path d="M 60 130 Q 100 150 140 130" stroke="#4ECDC4" stroke-width="4" fill="none" filter="url(#rasterize)" opacity="0.85"/>
  <rect x="70" y="150" width="60" height="20" fill="#95E1D3" filter="url(#rasterize)" opacity="0.85"/>
</svg>
