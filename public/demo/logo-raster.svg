<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Simulate JPEG compression artifacts and pixel noise -->
    <filter id="jpeg-artifacts" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.9" numOctaves="1" seed="2" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="graynoise"/>
      <feBlend in="SourceGraphic" in2="graynoise" mode="overlay" result="blended"/>
      <feGaussianBlur stdDeviation="0.8" result="blurred"/>
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues="0 0.08 0.16 0.24 0.33 0.41 0.49 0.57 0.65 0.73 0.82 0.9 1"/>
        <feFuncG type="discrete" tableValues="0 0.08 0.16 0.24 0.33 0.41 0.49 0.57 0.65 0.73 0.82 0.9 1"/>
        <feFuncB type="discrete" tableValues="0 0.08 0.16 0.24 0.33 0.41 0.49 0.57 0.65 0.73 0.82 0.9 1"/>
      </feComponentTransfer>
    </filter>
    <filter id="pixel-blur">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="edge-blur">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- Background - slightly off-white with noise -->
  <rect width="800" height="500" fill="#e8e8e8"/>
  <!-- Pixel grid noise pattern -->
  <rect width="800" height="500" fill="url(#pixelnoise)" opacity="0.15"/>

  <!-- RASTER label area - top banner -->
  <rect x="0" y="0" width="800" height="50" fill="#d0d0d0"/>
  <text x="400" y="32" font-family="monospace" font-size="16" text-anchor="middle" fill="#888" font-weight="bold">LOW QUALITY RASTER SOURCE (PNG/JPG)</text>

  <!-- Main content: a logo shape with blurry/pixelated rendering -->
  <!-- Outer circle - blurry -->
  <circle cx="220" cy="260" r="110" fill="#4a90e2" opacity="0.8" filter="url(#edge-blur)"/>
  <!-- Jagged/pixelated star shape -->
  <polygon points="220,175 238,213 280,213 247,237 259,279 220,256 181,279 193,237 160,213 202,213" 
    fill="#ffffff" opacity="0.9" filter="url(#pixel-blur)"/>

  <!-- Text - blurry/jagged -->
  <text x="220" y="410" font-family="Arial Black, sans-serif" font-size="42" text-anchor="middle" 
    fill="#222222" opacity="0.85" filter="url(#edge-blur)" letter-spacing="2">LOGO</text>
  <text x="220" y="445" font-family="monospace" font-size="13" text-anchor="middle" 
    fill="#555" opacity="0.9">blurry · jagged · artifact-ridden</text>

  <!-- JPEG block artifacts visible in background -->
  <g opacity="0.25">
    <rect x="100" y="160" width="16" height="16" fill="#4a90e2"/>
    <rect x="116" y="160" width="16" height="16" fill="#4590df"/>
    <rect x="132" y="160" width="16" height="16" fill="#4b91e3"/>
    <rect x="100" y="176" width="16" height="16" fill="#488ee1"/>
    <rect x="116" y="176" width="16" height="16" fill="#4a90e2"/>
    <rect x="148" y="160" width="16" height="16" fill="#4892e4"/>
    <rect x="164" y="160" width="16" height="16" fill="#4a90e2"/>
    <rect x="300" y="200" width="16" height="16" fill="#3a7ad0"/>
    <rect x="316" y="200" width="16" height="16" fill="#3c7cd2"/>
    <rect x="300" y="216" width="16" height="16" fill="#3878ce"/>
  </g>

  <!-- Divider line -->
  <line x1="420" y1="50" x2="420" y2="500" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right side: complex illustration - also raster-simulated -->
  <!-- Mountain landscape with pixelated edges -->
  <polygon points="420,450 520,200 620,450" fill="#5b8c5a" opacity="0.75" filter="url(#edge-blur)"/>
  <polygon points="540,450 640,170 760,450" fill="#3d6b3c" opacity="0.8" filter="url(#edge-blur)"/>
  <polygon points="420,450 500,280 580,450" fill="#7aab79" opacity="0.7" filter="url(#edge-blur)"/>

  <!-- Sun - blurry circle -->
  <circle cx="690" cy="130" r="50" fill="#f5c518" opacity="0.8" filter="url(#edge-blur)"/>
  <!-- Sun glow artifact -->
  <circle cx="690" cy="130" r="65" fill="#f5c518" opacity="0.2" filter="url(#edge-blur)"/>

  <!-- Sky gradient - banded (JPEG artifact simulation) -->
  <rect x="420" y="50" width="380" height="50" fill="#87ceeb" opacity="0.9"/>
  <rect x="420" y="100" width="380" height="50" fill="#80c8e8" opacity="0.9"/>
  <rect x="420" y="150" width="380" height="50" fill="#7ac3e5" opacity="0.9"/>
  <rect x="420" y="200" width="380" height="100" fill="#74bee2" opacity="0.9"/>
  <rect x="420" y="300" width="380" height="100" fill="#6eb9df" opacity="0.9"/>
  <rect x="420" y="400" width="380" height="100" fill="#a8d8a8" opacity="0.9"/>

  <!-- Caption -->
  <text x="610" y="490" font-family="monospace" font-size="12" text-anchor="middle" 
    fill="#666" opacity="0.9">banding · soft edges · compression noise</text>
</svg>
