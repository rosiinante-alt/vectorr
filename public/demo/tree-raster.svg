<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="tree-raster">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" result="displaced" />
      <feGaussianBlur in="displaced" stdDeviation="1.2" />
    </filter>
  </defs>
  
  <!-- Trunk -->
  <rect x="85" y="140" width="30" height="80" fill="#8B5A3C" filter="url(#tree-raster)" />
  
  <!-- Foliage circles -->
  <circle cx="100" cy="80" r="50" fill="#228B22" filter="url(#tree-raster)" opacity="0.85" />
  <circle cx="70" cy="110" r="35" fill="#2E8B57" filter="url(#tree-raster)" opacity="0.85" />
  <circle cx="130" cy="110" r="35" fill="#2E8B57" filter="url(#tree-raster)" opacity="0.85" />
  <circle cx="100" cy="140" r="30" fill="#3CB371" filter="url(#tree-raster)" opacity="0.85" />
</svg>
