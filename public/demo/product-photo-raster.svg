<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Simulated pixelated/blurry product photo -->
  <defs>
    <filter id="blur"><feGaussianBlur in="SourceGraphic" stdDeviation="3"/></filter>
  </defs>
  <rect width="400" height="300" fill="#E8E8E8"/>
  <!-- Background shadow/gradient effect with blur -->
  <ellipse cx="200" cy="250" rx="150" ry="40" fill="#000" opacity="0.2" filter="url(#blur)"/>
  <!-- Product shape (blurry) -->
  <path d="M 100 80 Q 110 50 150 50 L 250 50 Q 290 50 300 80 L 300 200 Q 290 230 250 230 L 150 230 Q 110 230 100 200 Z" fill="#C8B8A8" opacity="0.7" filter="url(#blur)"/>
  <!-- Highlight areas -->
  <ellipse cx="180" cy="100" rx="60" ry="40" fill="#FFF" opacity="0.4" filter="url(#blur)"/>
  <ellipse cx="220" cy="140" rx="50" ry="35" fill="#999" opacity="0.3" filter="url(#blur)"/>
  <!-- Pixelated grid -->
  <g opacity="0.1" stroke="#000" stroke-width="2">
    <line x1="0" y1="40" x2="400" y2="40"/><line x1="0" y1="80" x2="400" y2="80"/><line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/><line x1="0" y1="200" x2="400" y2="200"/><line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="67" y1="0" x2="67" y2="300"/><line x1="133" y1="0" x2="133" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="267" y1="0" x2="267" y2="300"/><line x1="333" y1="0" x2="333" y2="300"/>
  </g>
  <text x="200" y="285" font-size="12" text-anchor="middle" fill="#999">PHOTO (blurry)</text>
</svg>
