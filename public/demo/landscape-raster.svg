<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Pixelated landscape photo -->
  <defs>
    <filter id="blur3"><feGaussianBlur in="SourceGraphic" stdDeviation="3"/></filter>
  </defs>
  <!-- Sky gradient (pixelated) -->
  <rect width="400" height="150" fill="#87CEEB" filter="url(#blur3)"/>
  <!-- Mountains -->
  <polygon points="0,150 80,80 160,150" fill="#8B7355" opacity="0.7" filter="url(#blur3)"/>
  <polygon points="120,150 200,60 280,150" fill="#A0826D" opacity="0.8" filter="url(#blur3)"/>
  <polygon points="240,150 320,90 400,150" fill="#8B7355" opacity="0.75" filter="url(#blur3)"/>
  <!-- Foreground -->
  <rect y="150" width="400" height="150" fill="#6B8E23" opacity="0.7" filter="url(#blur3)"/>
  <!-- Trees/forest (blurry) -->
  <circle cx="100" cy="180" r="40" fill="#556B2F" opacity="0.6" filter="url(#blur3)"/>
  <circle cx="200" cy="200" r="50" fill="#6B8E23" opacity="0.6" filter="url(#blur3)"/>
  <circle cx="300" cy="180" r="45" fill="#556B2F" opacity="0.6" filter="url(#blur3)"/>
  <!-- Pixelated grid -->
  <g opacity="0.1" stroke="#000" stroke-width="2">
    <line x1="0" y1="40" x2="400" y2="40"/><line x1="0" y1="80" x2="400" y2="80"/><line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/><line x1="0" y1="200" x2="400" y2="200"/><line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="67" y1="0" x2="67" y2="300"/><line x1="133" y1="0" x2="133" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="267" y1="0" x2="267" y2="300"/><line x1="333" y1="0" x2="333" y2="300"/>
  </g>
  <text x="200" y="295" font-size="11" text-anchor="middle" fill="#666">PHOTO (blur)</text>
</svg>
